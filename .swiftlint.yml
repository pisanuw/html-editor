# SwiftLint configuration for html-editor.
#
# Goal: a gate that catches real problems (force-unwraps and force-tries on the
# UI path, dead code, sloppy spacing, redundant initialization) without fighting
# idiomatic SwiftUI or the deliberately byte-level HTML/CSS parsers in Core.
# CI runs `swiftlint --strict`, so every reported issue must be clean.

included:
  - HTMLEditor/HTMLEditor
  - Tests

excluded:
  - .build          # SwiftPM build products, incl. generated runner.swift
  - DerivedData
  - .swiftpm

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - closure_spacing
  - operator_usage_whitespace

disabled_rules:
  - todo                                     # planning notes are allowed
  - multiple_closures_with_trailing_closure  # idiomatic in SwiftUI bodies
  - large_tuple                              # small named tuples in the parsers

identifier_name:
  # The scanners use tight single-letter cursors (i, c, r, ns). Allow short
  # names; still flag empty and absurdly long ones.
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 320
  error: 400

cyclomatic_complexity:
  # The HTML/CSS/Emmet parsers are legitimately branchy state machines.
  warning: 20
  error: 30

function_parameter_count:
  # The folding API takes six positional inputs.
  warning: 6
  error: 8
